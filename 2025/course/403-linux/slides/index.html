          <textarea data-template># Linux

Architecture & Deployment <!-- .element: class="subtitle" -->

**Notes:**

Learn about the history of the Linux operating system.

---

## What is Linux?

<img src='../images/linux-e5cddb405e4f31d72be86ad8f41132b6.png' />

**Notes:**

[Linux](https://en.wikipedia.org/wiki/Linux) is a family of free and open source software operating systems
built around the [Linux kernel](https://en.wikipedia.org/wiki/Linux_kernel), an [operating system
kernel](https://en.wikipedia.org/wiki/Kernel_(operating_system)) first released in 1991, by [Linus Torvalds](https://en.wikipedia.org/wiki/Linus_Torvalds).

---

### Unix history

<!-- .element: class="hidden" -->

<img class='w-9/10' src='../images/unix-history-3e79ce3ed72a863bed4a1e26d64745f4.png' />

**Notes:**

It is based on [Unix](https://en.wikipedia.org/wiki/Unix), an operating system released in 1971 at AT&T's
[Bell Laboratories](https://en.wikipedia.org/wiki/Bell_Labs) in the United States. As it was [proprietary
software](https://en.wikipedia.org/wiki/Proprietary_software), Linus Torvalds decided to release his own [open
source](https://en.wikipedia.org/wiki/Open-source_software) kernel.

---

### Why use Linux?

- Open source philosophy
- Low or no upfront cost
- Better system stability
- Lightweight distributions (lower CPU/RAM usage & smaller size)

**Notes:**

There are many [reasons to use it](https://en.wikipedia.org/wiki/Linux_adoption#Reasons_for_adoption).

Note that no system is perfect. Linux also has [barriers to
adoption](https://en.wikipedia.org/wiki/Linux_adoption#Barriers_to_adoption), mostly the facts that it rarely comes pre-installed and
that it requires users to know more about managing their operating system.

---

### Where Linux is king

- [Embedded systems](https://en.wikipedia.org/wiki/Embedded_system) ([BusyBox](https://en.wikipedia.org/wiki/BusyBox) fits in 2.1MB)
- [Servers](https://en.wikipedia.org/wiki/Linux#Servers,_mainframes_and_supercomputers) (more than 75% of servers, most cloud workloads, most
  supercomputers)

---

### Linux distribution timeline

<a href='../images/linux-distribution-timeline-62fef185bdda3e997127e1ed610cf536.svg'>
  <img src='../images/major-linux-distributions-history-67a6ae4533c628988f57cf8b2f533a1e.png' width='70%' />
</a>

**Notes:**

Linux is not just one operating system, it is a family of systems called [Linux
distributions](https://en.wikipedia.org/wiki/Linux_distribution). For example, on desktop or server, the most
popular is [Ubuntu](https://www.ubuntu.com/).
