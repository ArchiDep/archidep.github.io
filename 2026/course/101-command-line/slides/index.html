## A short history of computers & computer interfaces

For old time's sake.

---

### The first general-purpose computer (1837)

The Analytical Engine, proposed by Charles Babbage <!-- .element: class="subtitle" -->

<div class="grid grid-cols-9 gap-4">
  <div class="col-span-3 col-start-2">
    <img src="images/analytical-engine-3dabf41171fd6eaac391da1d24c53def.jpg" alt="Analytical Engine">
  </div>
  <div class="col-span-1">&nbsp;</div>
  <div class="col-span-3">
    <img src="images/charles-babbage-9a2eba31e5b1c62be6fa6858f3d423c5.jpg" alt="Charles Babbage">
  </div>
</div>

**Notes:**

[Charles Babbage](https://en.wikipedia.org/wiki/Charles_Babbage), an English mathematician, proposed the
mechanical [Analytical Engine](https://en.wikipedia.org/wiki/Analytical_Engine): the first [digital](https://en.wikipedia.org/wiki/Digital_data)
[programmable](https://en.wikipedia.org/wiki/Computer_program), [general-purpose
computer](https://en.wikipedia.org/wiki/Computer).

---

### The first programmer (1842)

Ada Lovelace publishes the first algorithm <!-- .element: class="subtitle" -->

<div class="grid grid-cols-10">
  <div class="col-span-4 col-start-4">
    <img src="images/ada-lovelace-9e9d0bdd36fdd5f45fb76cbea5b1ce2f.png" alt="Ada Lovelace">
  </div>
</div>

**Notes:**

In 1842, [Ada Lovelace](https://en.wikipedia.org/wiki/Ada_Lovelace) translated into English and extensively
annotated a description of the engine, including a way to calculate [Bernoulli
numbers](https://en.wikipedia.org/wiki/Bernoulli_number) using the machine (widely considered to be the
[first complete computer program](https://en.wikipedia.org/wiki/Note_G)). She has been described as the first
computer programmer.

---

### A century later (1940s)

Alan Turing formalizes algorithms and computation <!-- .element: class="subtitle" -->

<div class="grid grid-cols-10">
  <div class="col-span-4 col-start-4">
    <img src="images/alan-turing-f4e7573a9777c1e34a791b2463059f22.jpg" alt="Alan Turing">
  </div>
</div>

> Did you see [The Imitation Game](https://en.wikipedia.org/wiki/The_Imitation_Game)?

**Notes:**

[**Alan Turing**](https://en.wikipedia.org/wiki/Alan_Turing) formalized the concepts of [algorithm](https://en.wikipedia.org/wiki/Algorithm)
and [computation](https://en.wikipedia.org/wiki/Computation) with the [Turing machine](https://en.wikipedia.org/wiki/Turing_machine). He is
widely considered to be the father of theoretical [computer
science](https://en.wikipedia.org/wiki/Computer_science) and [artificial
intelligence](https://en.wikipedia.org/wiki/Artificial_intelligence).

---

### ENIAC (1946)

<div class="grid grid-cols-10">
  <div class="col-span-8 col-start-2">
    <img src="images/eniac-305b1016fffbbac39f09afe832f054ca.jpg" alt="ENIAC">
  </div>
</div>

**Notes:**

At that time, there was no such thing as a stored computer program. Programs
were **physically hard-coded**. On the [ENIAC](https://en.wikipedia.org/wiki/ENIAC), this was done using
function tables with **hundreds of ten-way switches**, which took weeks.

---

### The first bug that was caught (1947)

<div class="grid grid-cols-6">
  <div class="col-span-4 col-start-2">
    <img src="images/bug-e964fc9893d63a81a3faf9027bc1e4a4.jpg" alt="Bug">
  </div>
</div>

**Notes:**

Computers like these are [electro-mechanical
computers](https://en.wikipedia.org/wiki/Mechanical_computer#Electro-mechanical_computers) because they were based on switches and
relays, as opposed to the [transistors](https://en.wikipedia.org/wiki/Transistor) our current electronic
computers are based on.

When you had a bug in one of these computers, _debugging_ meant getting your
hands dirty and finding the [actual bug](https://en.wikipedia.org/wiki/Bug_(engineering)#History) in the physical machine.

---

### Stored computer programs (1950s)

The Automated Computing Engine, designed by Alan Turing <!-- .element: class="subtitle" -->

<div class="grid grid-cols-10">
  <div class="col-span-8 col-start-2">
    <img src="images/ace-ef2b548190f855c9ab81839a31466dfa.jpg" alt="Automated Computing Engine">
  </div>
</div>

**Notes:**

The [Automatic Computing Engine (ACE)](https://en.wikipedia.org/wiki/Automatic_Computing_Engine) was a British early electronic
serial [stored-program computer](https://en.wikipedia.org/wiki/Stored-program_computer) designed by [Alan
Turing](https://en.wikipedia.org/wiki/Alan_Turing). It used [mercury delay lines for its main
memory](https://en.wikipedia.org/wiki/Delay-line_memory).

---

<div class="grid-cols-10">

### Punched cards (1950s)

One of the first user interfaces <!-- .element: class="subtitle" -->

<div class="grid grid-cols-12 gap-8">
  <div class="grid-5">&nbsp;</div>
  <div class="col-span-5 col-start-2">
    <img src="images/punched-card-4c034a3a0c63e7f279dc0aad4930821d.jpg" alt="Punched Card">

Invented in 1725 <!-- .element: style="margin-top: 0;" -->

  </div>
  <div class="col-span-5 col-start-7">
    <img src="images/keypunch-machine-b8a2d0a46f9cedceeeeba6962a53c245.jpg" alt="Keypunch Machine">
  </div>
</div>

**Notes:**

Many early general-purpose digital computers used [punched cards](https://en.wikipedia.org/wiki/Punched_card)
for data input, output and storage. Someone had to use a [keypunch](https://en.wikipedia.org/wiki/Keypunch)
machine to write your cards, then feed them to the computer.

Punched cards are much older than computers. They were first invented around
1725 to control mechanical [looms](https://en.wikipedia.org/wiki/Loom).

### TeleTYpewriter (1960s)

<p class="subtitle">The first <strong>command line interfaces (CLI)</strong></p>

<div class="grid grid-cols-10">
  <div class="col-span-8 col-start-2">
    <img src="images/tty-cbe2e0c716af13d553df8e50b9eb49eb.jpg" alt="TeleTYpewriter">
  </div>
</div>

**Notes:**

Teletypewriters (TTYs) became the most popular **computer terminals** in the
1960s. They were basically electromechanical typewriters adapted as a user
interface for early [mainframe computers](https://en.wikipedia.org/wiki/Mainframe_computer).

This is when the first **command line interfaces (CLI)** were created. As you
typed commands, a program running on the computer would interpret that input,
and the output would be printed on physical paper.

---

### Video terminals (1970s)

<div class="grid grid-cols-10">
  <div class="col-span-6 col-start-3">
    <img src="images/vt102-00b7e3a3823b8e5234a7e8493f5c9446.jpg" alt="VT102">
  </div>
</div>

**Notes:**

As available memory increased, **video terminals** such as the [VT100](https://en.wikipedia.org/wiki/VT100)
replaced TTYs in the 1970s. Initially they only displayed text. Hence they were
fundamentally the same as TTYs: textual input/output devices.

---

### Unix (1970s)

The first portable operating system <!-- .element: class="subtitle" -->

<div class="grid grid-cols-10">
  <div class="col-span-8 col-start-2">
    <img src="images/unix-374b657fb13a1046fe0523de61eb3119.png" alt="Unix">
  </div>
</div>

**Notes:**

It's also in this period that the [Unix](https://en.wikipedia.org/wiki/Unix) operating system was developed.
Compared to earlier systems, Unix was the first **portable operating system**
because it was written in the [C programming language](https://en.wikipedia.org/wiki/C_(programming_language)), allowing it to be
installed on multiple platforms.

Unix is the ancestor of [Linux](https://en.wikipedia.org/wiki/Linux). [FreeBSD](https://en.wikipedia.org/wiki/FreeBSD), a Unix-like system,
is also used as the basis for [macOS](https://en.wikipedia.org/wiki/MacOS) (since Mac OS X).

---

### Shells (1970s)

Text-based at that time <!-- .element: class="subtitle" -->

<div class="grid grid-cols-10">
  <div class="col-span-6 col-start-3">
    <img src="images/shell-7ad4e5fd1adadaf798cce7c7a40ca35d.png" alt="Shell">
  </div>
</div>

**Notes:**

In Unix-like systems, the program serving as the **command line interpreter**
(handling input/output from the terminal) is called a [**shell**](https://en.wikipedia.org/wiki/Unix_shell).
It is called this way because it is the outermost layer around the operating
system; it wraps and hides the lower-level kernel interface.

---

### Graphical User Interfaces (1980s)

Also a type of shell <!-- .element: class="subtitle" -->

<div class="grid grid-cols-12">
  <div class="col-span-6 col-start-4">
    <img src="images/xerox-star-fc3883bf375691a362521d00ff3cc889.jpg" alt="Shell">
  </div>
</div>

**Notes:**

Eventually, [graphical user interfaces (GUIs)](https://en.wikipedia.org/wiki/Graphical_user_interface) were introduced in reaction
to the perceived steep learning curve of command line interfaces. They are one
of the most common end user computer interface today.

Note that the GUI of a computer is also a shell. It's simply a different way to
interact with the kernel (graphical instead of textual).
