}
}
/* --- Around the diagram -------------------------------------------------- */
/* Drawn for a white background, in a dark page and on a slide alike. */
.diagram-figure .diagram-canvas {
background: #fff;
border-radius: 8px;
padding: 8px;
}
.diagram-figure svg.diagram {
display: block;
width: 100%;
height: auto;
}
/* A deck hides the legend, the teacher being there to explain, except in
print, which shows the diagram fully drawn. */
.diagram-figure.in-deck:not(.printed) .legend {
display: none;
}
.diagram-figure.in-deck svg.diagram {
max-height: 520px;
}
/* A slide of its own, marked `full-diagram`, makes the figure the whole window
but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,
since CSS cannot read a view box. The drawing's own margin is the card's
padding. */
section.full-diagram .diagram-figure.in-deck {
container-type: size;
display: flex;
align-items: center;
justify-content: center;
}
section.full-diagram .diagram-figure.in-deck .diagram-canvas {
padding: 0;
width: min(100cqw, 100cqh * var(--diagram-aspect, 2));
}
section.full-diagram .diagram-figure.in-deck svg.diagram {
max-height: none;
}
/* A page stepping through the diagram does what reveal.js does in a deck:
hides the steps not reached yet. The captions say what the legend would. */
.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}
.diagram-figure.stepping svg.diagram .fragment:not(.visible):not(.leg) {
opacity: 0;
visibility: hidden;
}
.diagram-figure.stepping .legend {
display: none;
}
/* The page's controls, in whatever colours the page is in. */
.diagram-figure .diagram-caption {
margin: 0.5em 0.25em 0;
}
.diagram-figure .diagram-controls {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 0.5em;
margin-top: 0.5em;
}
.diagram-figure .diagram-controls button {
font: inherit;
font-size: 0.9em;
color: inherit;
background: color-mix(in srgb, currentColor 8%, transparent);
border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
border-radius: 6px;
padding: 0.2em 0.75em;
cursor: pointer;
}
.diagram-figure .diagram-controls button:hover:not(:disabled) {
background: color-mix(in srgb, currentColor 16%, transparent);
border-color: color-mix(in srgb, currentColor 40%, transparent);
}
.diagram-figure .diagram-controls button.primary:hover:not(:disabled) {
background: #1a5fcc;
border-color: #1a5fcc;
}
.diagram-figure .diagram-controls button:disabled {
opacity: 0.4;
cursor: default;
}
.diagram-figure .diagram-controls button.primary {
background: #1f6feb;
border-color: #1f6feb;
color: #fff;
}
.diagram-figure .diagram-controls .counter {
min-width: 7em;
text-align: center;
font-size: 0.9em;
opacity: 0.7;
}
/* Printed fully drawn, with the caption that goes with it. */
@media print {
.diagram-figure .diagram-controls {
display: none;
}
.diagram-figure .diagram-canvas {
break-inside: avoid;
}
}

**Notes:**

Guess It and PostgreSQL, from the [SFTP deployment](/2026/course/410-sftp-deployment/), are two processes on the same
server. Each has its own memory: Guess It cannot read PostgreSQL's, nor
PostgreSQL Guess It's. Yet both are able to communicate. How?

---

### Connecting processes

<ul>
  <li class="fragment"><strong>Files</strong>: one process writes, another reads</li>
  <li class="fragment"><strong>Pipes</strong>: one's output is another's input</li>
  <li class="fragment"><strong>Sockets</strong>: as over the network, locally too</li>
  <li class="fragment"><strong>Shared memory</strong>: one region, which both see</li>
</ul>

**Notes:**

Since processes are isolated, they can only communicate through channels the
operating system provides:

- **Files**: one process can write to a file, and another can read that file.
- **Pipes**: you can send the standard output of one process into the standard
  input of another, as the `|` of a [shell pipeline](/2026/course/408-unix-processes/#pipelines) does.
- **Sockets**: programs use them to communicate over the network, but two
  processes on the same machine can use them too. This is how Guess It talks
  to PostgreSQL: its `DATABASE_URL` says `localhost:5432`, a port on the
  loopback address, which never leaves the server. Guess It would connect the
  same way to a database on another machine, with that machine's address
  instead.
- **Shared memory**: two processes can both ask the operating system for the
  same region of memory, which both then see. It is the fastest channel, since
  nothing is copied, but also the hardest to use correctly: the processes must
  take turns, or they change the same data at the same time. PostgreSQL's own
  processes, one per connection, share their cached data this way.

---

### Taking turns

<!-- .element: class="corner-title" -->

<coffee-queues style="width: 900px; margin: 0 auto">
  <span class="fragment"></span>
  <span class="fragment"></span>
</coffee-queues>

**Notes:**

- When one row of people queue at one coffee machine, each person takes a turn.
- When two rows of people queue at the same machine, they have to take turns
  too. Two queues are moving, but only one person at a time is served.
- When two coffee machines are available, each row can use one, and both rows
  are served at the same time. Two queues are moving, and two people are served
  at the same time.

This analogy illustrates the difference between **concurrent** and **parallel**
programs: each queue stands in for a program and its instructions being
executed.

- With one CPU core, the programs are concurrent: they **take turns on the same
  core**. If it happens fast enough, you get the illusion that they run at the
  same time, but it is still no faster than running the two programs one after
  the other if they both keep the core busy.
- With two CPU cores, the programs are parallel: they can actually run **at the
  same time**, and the total work is done faster.

This is a simplification. A modern CPU core can also execute several independent
instructions of the same program at the same time, and some cores can run two
threads at once, but they share the same circuits, so it's still not as fast as
two cores.

_Analogy from [Joe Armstrong](https://joearms.github.io/published/2013-04-05-concurrent-and-parallel-programming.html), the creator of Erlang_

svg.diagram.unfolded .folds-away path {
opacity: 1;
}
/* --- Data ---------------------------------------------------------------- */
/* A trip in two clicks: to the middle, where it waits, then the rest of the
way. Along the edge from --from to --to, which run backwards when it travels
against the arrow. */
svg.diagram .packet path {
fill: #1f6feb;
stroke: #1f6feb;
stroke-width: 3;
stroke-linejoin: round;
}
svg.diagram .packet text {
fill: #fff;
font-size: 13px;
font-weight: 700;
text-anchor: middle;
}
svg.diagram .packet .leg {
offset-rotate: 0deg;
offset-distance: 50%;
}
/* The second click must not hide the data before it is reached. */
svg.diagram .packet .leg.fragment {
opacity: 1;
visibility: inherit;
}
svg.diagram .packet .leg.fragment.visible {
offset-distance: var(--to);
opacity: 0;
}
/* In one click: gone once the next step is reached. */
svg.diagram .packet.whole.visible:not(.current-fragment) .leg:not(.visible) {
animation: none;
opacity: 0;
}
/* Nor does the second half of a trip outlive its step, such as a slow one cut
short by a click. */
svg.diagram .packet .leg.fragment.visible:not(.current-fragment) {
animation: none;
opacity: 0;
}
/* A part of the drawing a diagram becomes, arrived: drawn as that drawing
draws it, which reveal.js's `will-change` on its steps would not, keeping it
on a layer of its own. */
svg.diagram .arrive.visible {
/* Important: reveal.js's rules for fragments are more specific. */
will-change: auto !important;
}
/* --- Torn down ----------------------------------------------------------- */
/* Gone from a step on, such as a session closing; the fully drawn diagram still
shows it. The motion script sets `gone`. */
svg.diagram .gone {
/* Important: reveal.js's rules for visible fragments are more specific. */
opacity: 0 !important;
visibility: hidden !important;
transition:
opacity 0.6s,
visibility 0s 0.6s !important;
}
/* --- Motion -------------------------------------------------------------- */
@media screen and (prefers-reduced-motion: no-preference) {
/* A connection draws itself from the side that opened it: the path's length
is 1 (`pathLength`), whatever its shape. */
svg.diagram .draw-on.visible path {
stroke-dasharray: 1 1;
animation: diagram-draw 0.7s ease-out var(--delay, 0s) both;
}
/* Its label arrives with the line, not before. */
svg.diagram .draw-on.visible text {
animation: diagram-fade-in 0.3s ease-out calc(var(--delay, 0s) + 0.5s) both;
}
/* A control edge appears, then the process it starts. */
svg.diagram .fade-on.visible {
animation: diagram-fade-in 0.4s ease-out var(--delay, 0s) both;
}
/* A part of the drawing a diagram becomes, once the rest is in place. The
animation lets go of it once over, so that it is then drawn exactly as in
that drawing. */
svg.diagram .arrive.visible {
animation: diagram-fade-in 0.4s ease-out var(--delay, 0s) backwards;
}
/* The cursor types, then disappears on Enter. */
svg.diagram :is(.spawn, .input).visible .prompt .cursor {
display: inline;
animation:
diagram-cursor-move var(--type) steps(var(--chars), end) var(--t0) both,
diagram-cursor-blink 0.5s step-end infinite,
diagram-cursor-off 0.01s var(--enter) both;
}
/* Typed at a shell's prompt or into an application, which clears on Enter. */
svg.diagram :is(.spawn, .input).visible .prompt {
display: inline;
animation: diagram-cursor-off 0.01s var(--enter) both;
}
svg.diagram :is(.spawn, .input).visible .prompt .typed {
animation: diagram-type var(--type) steps(var(--chars), end) var(--t0) both;
}
/* The process starts: its box, its text, then its listening port. */
svg.diagram :is(.spawn, .child).visible &gt; rect:not(.glow) {
transform-box: fill-box;
transform-origin: center;
animation: diagram-box-in 0.35s ease-out var(--launch) both;
}
svg.diagram :is(.spawn, .child).visible &gt; text {
animation: diagram-fade-in 0.3s ease-out var(--launch) both;
}
svg.diagram :is(.spawn, .child).visible .socket {
animation: diagram-fade-in 0.3s ease-out calc(var(--launch) + 0.4s) both;
}
/* A process working while its step is the current one: its box brightens
three times while a cog turns in its top right corner, then both settle,
the cog slowing to a stop as the last pulse ends. A still cog means
settings, so it fades out as it stops. */
svg.diagram .process:has(&gt; .pulse.current-fragment) &gt; .glow {
animation: diagram-glow 0.8s ease-in-out 3;
}
svg.diagram .process:has(&gt; .pulse.current-fragment) .cog {
display: inline;
animation: diagram-fade-out 0.3s ease-in 2.3s both;
}
svg.diagram .process:has(&gt; .pulse.current-fragment) .cog path {
transform-box: fill-box;
transform-origin: center;
animation: diagram-spin 2.4s cubic-bezier(0.3, 0.5, 0.5, 1) both;
}
svg.diagram .packet.visible .leg:not(.visible) {
animation: diagram-leg-1 0.9s ease-in-out both;
}
svg.diagram .packet.whole.visible .leg:not(.visible) {
animation: diagram-trip 1.8s ease-in-out both;
}
svg.diagram .packet.visible .leg.visible {
animation: diagram-leg-2 1.6s ease-in-out both;
}
/* Heavy data, such as the hundreds of files of node_modules, is slower. */
svg.diagram .packet.heavy.visible .leg:not(.visible) {
animation-duration: 2.7s;
}
svg.diagram .packet.heavy.visible .leg.visible {
animation-duration: 4.8s;
}
svg.diagram .packet.heavy.whole.visible .leg:not(.visible) {
animation-duration: 6s;
}
/* A short-lived process works once started, then exits after a moment to
read it: its box and its edge fade out. No transition into its step:
Firefox would hold the box at the start of the transition, transparent,
while its exit animation waits to begin. */
svg.diagram .process.passing.current-fragment,
svg.diagram .edge.passing.current-fragment {
transition: none;
}
svg.diagram .passing.current-fragment &gt; .glow {
animation: diagram-glow 0.8s ease-in-out var(--work) 3;
}
svg.diagram .passing.current-fragment .cog {
display: inline;
animation: diagram-fade-out 0.3s ease-in calc(var(--work) + 2.3s) both;
}
svg.diagram .passing.current-fragment .cog path {
transform-box: fill-box;
transform-origin: center;
animation: diagram-spin 2.4s cubic-bezier(0.3, 0.5, 0.5, 1) var(--work) both;
}
svg.diagram .process.passing.current-fragment {
animation: diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
svg.diagram .edge.passing.current-fragment {
animation:
diagram-fade-in 0.4s ease-out var(--delay, 0s) both,
diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
/* A process starts waiting as its request sets off. */
svg.diagram .clock.visible {
animation: diagram-fade-in 0.4s ease-out 0.2s both;
}
/* Shown once the data that brings it has arrived. */
svg.diagram .arrives.visible {
animation: diagram-fade-in 0.2s ease-out 1.1s both;
}
}
@keyframes diagram-draw {
/* The arrowhead waits for the line to reach it. */
from {
stroke-dashoffset: 1;
marker-end: none;
}
99% {
marker-end: none;
}
to {
stroke-dashoffset: 0;
}
}
@keyframes diagram-leg-1 {
from {
offset-distance: var(--from);
opacity: 0;
}
20% {
opacity: 1;
}
to {
offset-distance: 50%;
opacity: 1;
}
}
/* Delivered: it sits on the box a moment, then fades. */
@keyframes diagram-leg-2 {
from {
offset-distance: 50%;
opacity: 1;
}
55% {
offset-distance: var(--to);
opacity: 1;
}
80% {
opacity: 1;
}
to {
offset-distance: var(--to);
opacity: 0;
}
}
@keyframes diagram-trip {

offset-distance: var(--from);
opacity: 0;
}
10% {
opacity: 1;
}
60% {
offset-distance: var(--to);
opacity: 1;
}
85% {
opacity: 1;
}
to {

opacity: 0;
}
}
@keyframes diagram-cursor-move {

}

}
}
@keyframes diagram-cursor-blink {
50% {

}
}
@keyframes diagram-cursor-off {
to {

}
}
@keyframes diagram-type {
from {

}

}
}
@keyframes diagram-box-in {
from {
opacity: 0;

}

}
}
@keyframes diagram-fade-in {
from {

}
}
@keyframes diagram-glow {

}
}
@keyframes diagram-spin {
to {

}
}
@keyframes diagram-fade-out {

opacity: 0;
}
}
@keyframes diagram-exit {
from {
opacity: 1;
}

opacity: 0;
}
}
/* --- Around the diagram -------------------------------------------------- */
/* Drawn for a white background, in a dark page and on a slide alike. */
.diagram-figure .diagram-canvas {
background: #fff;
border-radius: 8px;
padding: 8px;
}
.diagram-figure svg.diagram {
display: block;
width: 100%;
height: auto;
}
/* A deck hides the legend, the teacher being there to explain, except in
print, which shows the diagram fully drawn. */
.diagram-figure.in-deck:not(.printed) .legend {
display: none;
}
.diagram-figure.in-deck svg.diagram {
max-height: 520px;
}
/* A slide of its own, marked `full-diagram`, makes the figure the whole window
but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,
since CSS cannot read a view box. The drawing's own margin is the card's
padding. */
section.full-diagram .diagram-figure.in-deck {
container-type: size;
display: flex;
align-items: center;
justify-content: center;
}
section.full-diagram .diagram-figure.in-deck .diagram-canvas {
padding: 0;
width: min(100cqw, 100cqh * var(--diagram-aspect, 2));
}
section.full-diagram .diagram-figure.in-deck svg.diagram {
max-height: none;
}
/* A page stepping through the diagram does what reveal.js does in a deck:
hides the steps not reached yet. The captions say what the legend would. */
.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}
.diagram-figure.stepping svg.diagram .fragment:not(.visible):not(.leg) {
opacity: 0;
visibility: hidden;
}
.diagram-figure.stepping .legend {
display: none;
}
/* The page's controls, in whatever colours the page is in. */
.diagram-figure .diagram-caption {
margin: 0.5em 0.25em 0;
}
.diagram-figure .diagram-controls {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 0.5em;
margin-top: 0.5em;
}
.diagram-figure .diagram-controls button {
font: inherit;
font-size: 0.9em;
color: inherit;
background: color-mix(in srgb, currentColor 8%, transparent);
border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
border-radius: 6px;
padding: 0.2em 0.75em;
cursor: pointer;
}
.diagram-figure .diagram-controls button:hover:not(:disabled) {
background: color-mix(in srgb, currentColor 16%, transparent);
border-color: color-mix(in srgb, currentColor 40%, transparent);
}
.diagram-figure .diagram-controls button.primary:hover:not(:disabled) {
background: #1a5fcc;
border-color: #1a5fcc;
}
.diagram-figure .diagram-controls button:disabled {
opacity: 0.4;
cursor: default;
}
.diagram-figure .diagram-controls button.primary {
background: #1f6feb;
border-color: #1f6feb;
color: #fff;
}
.diagram-figure .diagram-controls .counter {
min-width: 7em;
text-align: center;
font-size: 0.9em;
opacity: 0.7;
}
/* Printed fully drawn, with the caption that goes with it. */
@media print {
.diagram-figure .diagram-controls {
display: none;
}
.diagram-figure .diagram-canvas {
break-inside: avoid;
}
}

<template class="diagram-captions"><p data-caption="rest">This diagram shows a single core, and two programs in memory, A and B, beside the kernel and init. The core runs a few of one program’s instructions, then the kernel switches it to the other: the programs take turns, they are concurrent.</p><p data-caption="0">A single core, and two programs in memory, A and B, both to run.</p><p data-caption="1">The core runs some of program A’s instructions, then the kernel, which switches the core to program B, then some of B’s, and so on: each program picks up where it stopped. The programs take turns: they are concurrent.</p></template>

**Notes:**

Programs being executed **concurrently** on a single core, like two rows of
people queueing at one coffee machine. Each process takes turns on the core, and
the kernel switches between them fast enough that both seem to run at once.

The kernel takes the core back with an interrupt, which happens at regular
intervals, a few hundred to a thousand times a second. The core jumps to the
kernel's code, regardless of what the process was doing. The kernel notes where
the process stopped, picks the one to run next, and jumps back into it where it
had stopped in turn.

This is one of the responsibilities the operating system handles transparently,
allowing what is known as
[time-sharing](https://en.wikipedia.org/wiki/Time-sharing) since the 1960s:
several users can run programs on the same machine at once, each thinking they
have the machine to themselves, even if it has only one core.

the one a deck prints, and the one shown without JavaScript. */
/* --- At rest ------------------------------------------------------------- */
svg.diagram .prompt,
svg.diagram .process .cog {
display: none;
}
svg.diagram .process rect.glow {
fill: #fff;
stroke: none;
opacity: 0;
}
svg.diagram .process .cog path {
fill: #fff;
fill-rule: evenodd;
stroke: none;
}
/* Waiting for an answer: a still clock, where the cog turns while working. */
svg.diagram .process .clock :is(circle, path) {
fill: none;
stroke: #fff;
stroke-width: 1.5;
stroke-linecap: round;
stroke-linejoin: round;
}
/* Travelling data exists only while it travels. */
svg.diagram .overlay:not(.visible) {
display: none;
}
/* Transient: shown from its step until it is torn down, but not when fully
drawn, such as a command that has finished by the end of the story. */
svg.diagram .transient:not(.visible) {
display: none;
}
/* A detail: shown while the diagram is explained, in a page stepping through it
or in a deck, but left out of the fully drawn diagram, at rest and in print,
since students are not expected to draw it. */
svg.diagram .detail {
display: none;
}
.diagram-figure:is(.stepping, .in-deck:not(.printed)) svg.diagram .detail {
display: inline;
}
/* The other way round: only in the fully drawn diagram, and hidden while
stepping through it, such as what no step of the story shows. */
.diagram-figure:is(.stepping, .in-deck:not(.printed)) svg.diagram .at-rest {
display: none;
}
/* A short-lived process, and the control edge that started it, only while
their step is the current one. */
svg.diagram .passing:not(.current-fragment) {
opacity: 0;
visibility: hidden;
}
/* --- Typing -------------------------------------------------------------- */
/* The typed text and the cursor are placed after the prompt in characters of
the monospace font, whichever one shows them. */
svg.diagram .prompt text,
svg.diagram .process .prompt text,
svg.diagram .prompt-line text {
font-family:
ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono',
'Courier New', monospace;
font-size: 12px;
font-weight: 700;
fill: #000;
text-anchor: start;
}
svg.diagram .prompt .typed,
svg.diagram .prompt .cursor {
transform: translateX(calc(var(--at, 0) * 1ch));
}
svg.diagram .prompt .cursor {
display: none;
}
/* --- Folding ------------------------------------------------------------- */
/* Until the fold, each folded process shows its own label, and the edges
between them are drawn; after it, the stack's label. The motion script moves
the processes and sets `unfolded`. */
svg.diagram .process .own {
opacity: 0;
transition: opacity 0.4s;
}
svg.diagram.unfolded .process .own {
opacity: 1;
}
svg.diagram .process .stack-label {
transition: opacity 0.4s;
}
svg.diagram.unfolded .process .stack-label {
opacity: 0;
}
svg.diagram .folds-away path {
opacity: 0;
transition: opacity 0.4s;
}
svg.diagram.unfolded .folds-away path {
opacity: 1;
}
/* --- Data ---------------------------------------------------------------- */
/* A trip in two clicks: to the middle, where it waits, then the rest of the
way. Along the edge from --from to --to, which run backwards when it travels
against the arrow. */
svg.diagram .packet path {
fill: #1f6feb;
stroke: #1f6feb;
stroke-width: 3;
stroke-linejoin: round;
}
svg.diagram .packet text {
fill: #fff;
font-size: 13px;
font-weight: 700;
text-anchor: middle;
}
svg.diagram .packet .leg {
offset-rotate: 0deg;
offset-distance: 50%;
}
/* The second click must not hide the data before it is reached. */
svg.diagram .packet .leg.fragment {
opacity: 1;
visibility: inherit;
}
svg.diagram .packet .leg.fragment.visible {
offset-distance: var(--to);
opacity: 0;
}
/* In one click: gone once the next step is reached. */
svg.diagram .packet.whole.visible:not(.current-fragment) .leg:not(.visible) {
animation: none;
opacity: 0;
}
/* Nor does the second half of a trip outlive its step, such as a slow one cut
short by a click. */
svg.diagram .packet .leg.fragment.visible:not(.current-fragment) {
animation: none;
opacity: 0;
}
/* A part of the drawing a diagram becomes, arrived: drawn as that drawing
draws it, which reveal.js's `will-change` on its steps would not, keeping it
on a layer of its own. */
svg.diagram .arrive.visible {
/* Important: reveal.js's rules for fragments are more specific. */
will-change: auto !important;
}
/* --- Torn down ----------------------------------------------------------- */
/* Gone from a step on, such as a session closing; the fully drawn diagram still
shows it. The motion script sets `gone`. */
svg.diagram .gone {
/* Important: reveal.js's rules for visible fragments are more specific. */
opacity: 0 !important;
visibility: hidden !important;
transition:
opacity 0.6s,
visibility 0s 0.6s !important;
}
/* --- Motion -------------------------------------------------------------- */
@media screen and (prefers-reduced-motion: no-preference) {
/* A connection draws itself from the side that opened it: the path's length
is 1 (`pathLength`), whatever its shape. */
svg.diagram .draw-on.visible path {
stroke-dasharray: 1 1;
animation: diagram-draw 0.7s ease-out var(--delay, 0s) both;
}
/* Its label arrives with the line, not before. */
svg.diagram .draw-on.visible text {
animation: diagram-fade-in 0.3s ease-out calc(var(--delay, 0s) + 0.5s) both;
}
/* A control edge appears, then the process it starts. */
svg.diagram .fade-on.visible {
animation: diagram-fade-in 0.4s ease-out var(--delay, 0s) both;
}
/* A part of the drawing a diagram becomes, once the rest is in place. The
animation lets go of it once over, so that it is then drawn exactly as in
that drawing. */
svg.diagram .arrive.visible {
animation: diagram-fade-in 0.4s ease-out var(--delay, 0s) backwards;
}
/* The cursor types, then disappears on Enter. */
svg.diagram :is(.spawn, .input).visible .prompt .cursor {
display: inline;
animation:
diagram-cursor-move var(--type) steps(var(--chars), end) var(--t0) both,
diagram-cursor-blink 0.5s step-end infinite,
diagram-cursor-off 0.01s var(--enter) both;
}
/* Typed at a shell's prompt or into an application, which clears on Enter. */
svg.diagram :is(.spawn, .input).visible .prompt {
display: inline;
animation: diagram-cursor-off 0.01s var(--enter) both;
}
svg.diagram :is(.spawn, .input).visible .prompt .typed {
animation: diagram-type var(--type) steps(var(--chars), end) var(--t0) both;
}
/* The process starts: its box, its text, then its listening port. */
svg.diagram :is(.spawn, .child).visible &gt; rect:not(.glow) {
transform-box: fill-box;
transform-origin: center;
animation: diagram-box-in 0.35s ease-out var(--launch) both;
}
svg.diagram :is(.spawn, .child).visible &gt; text {
animation: diagram-fade-in 0.3s ease-out var(--launch) both;
}
svg.diagram :is(.spawn, .child).visible .socket {
animation: diagram-fade-in 0.3s ease-out calc(var(--launch) + 0.4s) both;
}
/* A process working while its step is the current one: its box brightens
three times while a cog turns in its top right corner, then both settle,
the cog slowing to a stop as the last pulse ends. A still cog means
settings, so it fades out as it stops. */
svg.diagram .process:has(&gt; .pulse.current-fragment) &gt; .glow {
animation: diagram-glow 0.8s ease-in-out 3;
}
svg.diagram .process:has(&gt; .pulse.current-fragment) .cog {
display: inline;
animation: diagram-fade-out 0.3s ease-in 2.3s both;
}
svg.diagram .process:has(&gt; .pulse.current-fragment) .cog path {
transform-box: fill-box;
transform-origin: center;
animation: diagram-spin 2.4s cubic-bezier(0.3, 0.5, 0.5, 1) both;
}
svg.diagram .packet.visible .leg:not(.visible) {
animation: diagram-leg-1 0.9s ease-in-out both;
}
svg.diagram .packet.whole.visible .leg:not(.visible) {
animation: diagram-trip 1.8s ease-in-out both;
}
svg.diagram .packet.visible .leg.visible {
animation: diagram-leg-2 1.6s ease-in-out both;
}
/* Heavy data, such as the hundreds of files of node_modules, is slower. */
svg.diagram .packet.heavy.visible .leg:not(.visible) {
animation-duration: 2.7s;
}
svg.diagram .packet.heavy.visible .leg.visible {
animation-duration: 4.8s;
}
svg.diagram .packet.heavy.whole.visible .leg:not(.visible) {
animation-duration: 6s;
}
/* A short-lived process works once started, then exits after a moment to
read it: its box and its edge fade out. No transition into its step:
Firefox would hold the box at the start of the transition, transparent,
while its exit animation waits to begin. */
svg.diagram .process.passing.current-fragment,
svg.diagram .edge.passing.current-fragment {
transition: none;
}
svg.diagram .passing.current-fragment &gt; .glow {
animation: diagram-glow 0.8s ease-in-out var(--work) 3;
}
svg.diagram .passing.current-fragment .cog {
display: inline;
animation: diagram-fade-out 0.3s ease-in calc(var(--work) + 2.3s) both;
}
svg.diagram .passing.current-fragment .cog path {
transform-box: fill-box;
transform-origin: center;
animation: diagram-spin 2.4s cubic-bezier(0.3, 0.5, 0.5, 1) var(--work) both;
}
svg.diagram .process.passing.current-fragment {
animation: diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
svg.diagram .edge.passing.current-fragment {
animation:
diagram-fade-in 0.4s ease-out var(--delay, 0s) both,
diagram-exit 0.8s ease-in calc(var(--work) + 3.9s) forwards;
}
/* A process starts waiting as its request sets off. */
svg.diagram .clock.visible {
animation: diagram-fade-in 0.4s ease-out 0.2s both;
}
/* Shown once the data that brings it has arrived. */
svg.diagram .arrives.visible {
animation: diagram-fade-in 0.2s ease-out 1.1s both;
}
}
@keyframes diagram-draw {
/* The arrowhead waits for the line to reach it. */
from {
stroke-dashoffset: 1;
marker-end: none;
}
99% {
marker-end: none;
}
to {
stroke-dashoffset: 0;
}
}
@keyframes diagram-leg-1 {
from {
offset-distance: var(--from);
opacity: 0;
}
20% {
opacity: 1;
}
to {
offset-distance: 50%;
opacity: 1;
}
}
/* Delivered: it sits on the box a moment, then fades. */
@keyframes diagram-leg-2 {
from {
offset-distance: 50%;
opacity: 1;
}
55% {
offset-distance: var(--to);
opacity: 1;
}
80% {
opacity: 1;
}
to {
offset-distance: var(--to);
opacity: 0;
}
}
@keyframes diagram-trip {
from {
offset-distance: var(--from);
opacity: 0;
}
10% {
opacity: 1;
}
60% {
offset-distance: var(--to);
opacity: 1;
}
85% {
opacity: 1;
}
to {
offset-distance: var(--to);
opacity: 0;
}
}
@keyframes diagram-cursor-move {
from {
transform: translateX(calc(var(--at, 0) * 1ch));
}
to {
transform: translateX(calc((var(--at, 0) + var(--chars)) * 1ch));
}
}
@keyframes diagram-cursor-blink {
50% {
opacity: 0;
}
}
@keyframes diagram-cursor-off {
to {
visibility: hidden;
}
}
@keyframes diagram-type {
from {
clip-path: inset(0 100% 0 0);
}
to {
clip-path: inset(0);
}
}
@keyframes diagram-box-in {
from {
opacity: 0;
transform: scale(0.8, 0.5);
}
to {
opacity: 1;
transform: none;
}
}
@keyframes diagram-fade-in {
from {
opacity: 0;
}
}
@keyframes diagram-glow {
50% {
opacity: 0.3;
}
}
@keyframes diagram-spin {
to {
transform: rotate(1turn);
}
}
@keyframes diagram-fade-out {
to {
opacity: 0;
}
}
@keyframes diagram-exit {
from {
opacity: 1;
}
to {
opacity: 0;
}
}
/* --- Around the diagram -------------------------------------------------- */
/* Drawn for a white background, in a dark page and on a slide alike. */
.diagram-figure .diagram-canvas {
background: #fff;
border-radius: 8px;
padding: 8px;
}
.diagram-figure svg.diagram {
display: block;
width: 100%;
height: auto;
}
/* A deck hides the legend, the teacher being there to explain, except in
print, which shows the diagram fully drawn. */
.diagram-figure.in-deck:not(.printed) .legend {
display: none;
}
.diagram-figure.in-deck svg.diagram {
max-height: 520px;
}
/* A slide of its own, marked `full-diagram`, makes the figure the whole window
but for the strip of the logos and controls: the card is as large as the
drawing's proportions allow in it, which the deck gives as --diagram-aspect,
since CSS cannot read a view box. The drawing's own margin is the card's
padding. */
section.full-diagram .diagram-figure.in-deck {
container-type: size;
display: flex;
align-items: center;
justify-content: center;
}
section.full-diagram .diagram-figure.in-deck .diagram-canvas {
padding: 0;
width: min(100cqw, 100cqh * var(--diagram-aspect, 2));
}
section.full-diagram .diagram-figure.in-deck svg.diagram {
max-height: none;
}
/* A page stepping through the diagram does what reveal.js does in a deck:
hides the steps not reached yet. The captions say what the legend would. */
.diagram-figure.stepping svg.diagram .fragment {
transition: opacity 0.2s;
}
.diagram-figure.stepping svg.diagram .fragment:not(.visible):not(.leg) {
opacity: 0;
visibility: hidden;
}
.diagram-figure.stepping .legend {
display: none;
}
/* The page's controls, in whatever colours the page is in. */
.diagram-figure .diagram-caption {
margin: 0.5em 0.25em 0;
}
.diagram-figure .diagram-controls {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: 0.5em;
margin-top: 0.5em;
}
.diagram-figure .diagram-controls button {
font: inherit;
font-size: 0.9em;
color: inherit;
background: color-mix(in srgb, currentColor 8%, transparent);
border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
border-radius: 6px;
padding: 0.2em 0.75em;
cursor: pointer;
}
.diagram-figure .diagram-controls button:hover:not(:disabled) {
background: color-mix(in srgb, currentColor 16%, transparent);
border-color: color-mix(in srgb, currentColor 40%, transparent);
}
.diagram-figure .diagram-controls button.primary:hover:not(:disabled) {
background: #1a5fcc;
border-color: #1a5fcc;
}
.diagram-figure .diagram-controls button:disabled {
opacity: 0.4;
cursor: default;
}
.diagram-figure .diagram-controls button.primary {
background: #1f6feb;
border-color: #1f6feb;
color: #fff;
}
.diagram-figure .diagram-controls .counter {
min-width: 7em;
text-align: center;
font-size: 0.9em;
opacity: 0.7;
}
/* Printed fully drawn, with the caption that goes with it. */
@media print {
.diagram-figure .diagram-controls {
display: none;
}
.diagram-figure .diagram-canvas {
break-inside: avoid;
}
}

<template class="diagram-captions"><p data-caption="rest">This diagram shows two cores, and two programs in memory, A and B, beside the kernel and init. Each core runs one of the programs, both at the same time: they are parallel.</p><p data-caption="0">A single core, and two programs in memory, A and B, both to run.</p><p data-caption="1">A second core: another complete processor, on the same buses as the first, reading the same memory.</p><p data-caption="2">Each core runs one program: the first core runs program A’s instructions while the second runs program B’s, at the same time. The programs run in parallel.</p><p data-caption="3">Program B ends: the kernel frees its memory.</p><p data-caption="4">Program A runs alone: only the first core works. Program A was not written to use more than one core, so the second core stays idle.</p><p data-caption="5">Program A ends, and the kernel starts program C, which is written to run on several cores at once.</p><p data-caption="6">Program C runs on both cores at the same time: each core runs a different part of program C’s instructions, as two threads of the same program, sharing its memory.</p></template>
</div>


**Notes:**

Programs being executed **in parallel** on two cores, like two rows of people
queueing at two coffee machines. Each core is a complete processor that executes
its own instructions. A typical laptop today has between 4 and 16 cores.

With concurrency, we only get the illusion of programs running at the same time.
With parallelism, programs A and B in this illustration actually run at the same
time, and the total work is done faster.

A single program cannot choose a core itself. It asks the operating system for
more processes or **threads** (several flows of instructions inside one process,
sharing its memory), and the operating system decides which core runs each one
and when.

This means that a single program does not necessarily get faster on a machine
with more cores: it has to be programmed to use them, and its work has to be
splittable. Two cores make a program twice as fast only if its work splits
evenly between its threads.

In this illustration, program A is written as a single flow of instructions, so
it runs on one core while the other stays idle. Program C is written to run on
several cores: it has two threads, which the operating system can run on both
cores at once.

Read on with [two queues, one coffee machine](/2026/course/411-how-a-computer-works/#appendix-two-queues-one-coffee-machine), to go further: work that cannot be
split, Node.js running all your JavaScript on a single thread, and how
processes, threads, event loops, Go and Erlang organize work in parallel.
