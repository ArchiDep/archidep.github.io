          <textarea data-template># Domain Name System (DNS)

Architecture & Deployment <!-- .element: class="subtitle" -->

**Notes:**

Learn the basics of the [Domain Name System (DNS)](https://en.wikipedia.org/wiki/Domain_Name_System) and configure a domain name for your server with [Gandi.net](https://www.gandi.net/).

**You will need**

- A server with a public IP address
- A Gandi account that is the administrator or technical contact for a domain

**Recommended reading**

- [Unix Networking](/2026/course/408-unix-networking/)

---

## What is the Domain Name System?

![Domain Name System](images/dns-b5d292a35e10b3f06be09fc952beffe7.gif)

---

### Domain name system

![Domain Name System](images/dns-a4291410e0ceadac600c28f1ca537bd7.jpg)

**Notes:**

The [**Domain Name System (DNS)**](https://en.wikipedia.org/wiki/Domain_Name_System) is a hierarchical decentralized naming
system for computers connected to the Internet or a private network. Most
prominently, it **translates human-readable domain names** (like `google.com`)
**to numerical IP addresses** (like `40.127.1.70`) needed for locating computers
with the underlying network protocols. The Domain Name System has been an
essential component of the functionality of the Internet since 1985.

---

### DNS hierarchy

<p class='center'><img class='w80' src='images/dns-hierarchy-4a2079d6428fd76aa1d8efdc11f0cab7.png' /></p>

[ICANN](https://en.wikipedia.org/wiki/ICANN) manages [top-level domains (TLDs)](https://en.wikipedia.org/wiki/Top-level_domain).

**Notes:**

Second-level domains are delegated to other organizations.

You can buy your own [generic top-level domain](https://en.wikipedia.org/wiki/Generic_top-level_domain) since 2012 for $185,000.

---

### DNS zone

![DNS Zone](./images/dns-zone-305fd9b24d19df5b9937680354917de5.png)

**Notes:**

A [DNS zone](https://en.wikipedia.org/wiki/DNS_zone) is a subset of the domain name space for which
administrative responsibility has been delegated to a single manager.

For example, Microsoft has purchased the rights to manage the `microsoft.com`
domain and all its subdomains from the manager of the `.com` [top-level domain
(TLD)](https://en.wikipedia.org/wiki/Top-level_domain). Once they have those rights, they can create any number of
subdomains for their business needs.

You can also purchase a domain name as an individual, giving you the right to
manage that portion of the DNS hierarchy.
